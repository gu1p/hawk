name: "Rebase from upstream"

on:
  schedule:
    - cron: "20 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10

jobs:
  rebase:
    name: "Rebase main onto astral-sh/hawk"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "Rebase onto upstream"
        id: rebase
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/astral-sh/hawk.git
          git fetch --no-tags upstream main:refs/remotes/upstream/main

          before="$(git rev-parse HEAD)"
          git rebase upstream/main
          after="$(git rev-parse HEAD)"

          if [[ "$before" == "$after" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: "Install Rust toolchain"
        if: steps.rebase.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          rustup show
          rustup component add rustfmt clippy

      - name: "Check Rust formatting"
        if: steps.rebase.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: cargo fmt --all --check

      - name: "Lint"
        if: steps.rebase.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: "Test"
        if: steps.rebase.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: cargo test --workspace --all-features --locked

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.rebase.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: "Check repository formatting"
        if: steps.rebase.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          npm ci --ignore-scripts
          ./node_modules/.bin/prettier --check .

      - name: "Push rebased main"
        if: steps.rebase.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          expected="$(git rev-parse refs/remotes/origin/main)"
          git push --force-with-lease=refs/heads/main:"$expected" origin HEAD:main
